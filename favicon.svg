<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: same dark navy as the landing page -->
  <rect width="64" height="64" rx="14" fill="#0b1220"/>

  <!-- Beacon glow dots, echoing the red/blue strobe on the landing page -->
  <circle cx="13" cy="20" r="7" fill="#ef4444" opacity="0.35"/>
  <circle cx="13" cy="20" r="3.2" fill="#ef4444"/>
  <circle cx="51" cy="20" r="7" fill="#3b82f6" opacity="0.35"/>
  <circle cx="51" cy="20" r="3.2" fill="#3b82f6"/>

  <!-- Bus body -->
  <rect x="8" y="27" width="48" height="20" rx="6" fill="#2563eb"/>
  <rect x="8" y="27" width="48" height="20" rx="6" fill="none" stroke="#0b1220" stroke-width="1.5"/>

  <!-- Windows -->
  <rect x="13" y="31" width="38" height="8" rx="2" fill="#eef2ff"/>
  <line x1="24" y1="31" x2="24" y2="39" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="34" y1="31" x2="34" y2="39" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="44" y1="31" x2="44" y2="39" stroke="#2563eb" stroke-width="1.6"/>

  <!-- Wheels -->
  <circle cx="20" cy="48" r="6" fill="#111827"/>
  <circle cx="20" cy="48" r="2.3" fill="#9ca3af"/>
  <circle cx="44" cy="48" r="6" fill="#111827"/>
  <circle cx="44" cy="48" r="2.3" fill="#9ca3af"/>
</svg>
