<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Response — Dispatch</title>
<script src="config.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    line-height: 1.4;
    background: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #18181b; }
  }
  .site-header { padding: 1rem 1rem 0.5rem; }
  .site-header img {
    display: block;
    width: 100%;
    max-width: 480px;
    height: auto;
    margin: 0 auto;
  }
  .page-content { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin: 0 0 1rem; background: #ffffffaa; }
  @media (prefers-color-scheme: dark) {
    fieldset { background: #ffffff08; }
  }
  legend { padding: 0 0.4rem; font-weight: 600; }
  label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 500; }
  input, select {
    width: 100%; box-sizing: border-box; padding: 0.5rem; font-size: 1rem;
    border: 1px solid #8886; border-radius: 6px; background: transparent; color: inherit;
  }
  button {
    font-size: 1rem; padding: 0.6rem 1rem; border-radius: 6px; border: none;
    cursor: pointer; margin-top: 0.75rem;
  }
  .primary { background: #2563eb; color: #fff; }
  .danger { background: #dc2626; color: #fff; }
  .secondary { background: #8884; color: inherit; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .row > button { flex: 1; }
  #message { margin: 1rem 0; padding: 0.75rem; border-radius: 6px; display: none; }
  #message.info { display: block; background: #2563eb22; }
  #message.error { display: block; background: #dc262622; }
  #message.success { display: block; background: #16a34a22; }
  .hidden { display: none !important; }
  .trip-detail { margin: 0.15rem 0; }
  .trip-detail b { display: inline-block; min-width: 6.5rem; }
  .driver-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
  .driver-list button { margin-top: 0; text-align: left; }
  small { opacity: 0.7; }
</style>
</head>
<body>

<!--
  Front-end <-> n8n contract this page relies on (Step 6 of the build order
  implements the n8n side of this):

  GET  {lookupWebhookUrl}?tripId=T-0001            (reuses Step 3's endpoint)
       Header: X-Dispatch-Secret: <sharedSecret>
       200 -> { tripId, tripDate, pickupTime, pickupLocation, dropoffLocation,
                durationMin, status, pendingReconfirmation,
                riderStatus1, riderStatus2, escortStatus }
              riderStatus1/2 and escortStatus are blank (slot not needed for
              this trip) / 'Open' (broadcasting to the roster) / 'Filled'
       404 -> trip not found

  pendingReconfirmation (Step 9): true when a Filled trip's date/location
  changed after the assigned driver accepted — that driver's personalized
  link shows Accept/Decline again instead of the normal "already taken"
  block. Enforced server-side (driver identity match); this flag only
  controls the UI gate.

  GET  {driversWebhookUrl} / {ridersWebhookUrl} / {escortsWebhookUrl}
       (picker fallback only, used when tripId is present but no
       driverId/riderId/escortId — e.g. ?tripId=...&respondAs=rider)
       Header: X-Dispatch-Secret: <sharedSecret>
       200 -> [ { driverId|riderId|escortId, name }, ... ]  (active roster
              only, no phone numbers sent to the client — last-4 is
              checked server-side)

  POST {respondWebhookUrl}
       Header: X-Dispatch-Secret: <sharedSecret>
       Body (personalized driver link): { tripId, driverId, action: 'accept'|'decline' }
       Body (driver picker):            { tripId, driverName, last4, action: 'accept'|'decline' }
       Body (personalized rider link):  { tripId, riderId, action: 'accept'|'decline' }
       Body (rider picker):             { tripId, riderName, last4, action: 'accept'|'decline' }
       Body (personalized escort link): { tripId, escortId, action: 'accept'|'decline' }
       Body (escort picker):            { tripId, escortName, last4, action: 'accept'|'decline' }
       200 -> { tripId, status, message }
       400 -> { message } (validation, last-4 mismatch — kept generic, doesn't
              reveal whether the name or the digits were wrong)
       404 -> { message } (trip, driver, rider, or escort not found)
       409 -> { message } (slot already filled/full)

  Riders and the vehicle escort work like drivers, not a typed-in name:
  they're a registered roster (Riders / Vehicle Escorts tabs), broadcast to
  on trip creation, first to accept locks a slot — same trust model as a
  driver's personalized link (no last-4 check) or picker (name + last-4,
  verified server-side), same "already taken"/"full" semantics on a 409.
  A rider link/picker choice is a single identity, not per-slot — accepting
  tries Rider Slot 1 first, falls back to Slot 2 if Slot 1 is already
  filled, and 409s only if both are filled. Escort has just the one slot.

  ?respondAs=rider|escort on a link with no riderId/escortId/driverId shows
  the picker fallback for that roster (there's no calendar-event equivalent
  for riders/escort to click into, so this is the manual fallback path).
-->

<header class="site-header">
  <img src="banner.png" alt="Trip Dispatch">
</header>

<div id="app" class="page-content">
  <div id="message"></div>

  <fieldset id="trip-fieldset" class="hidden">
    <legend>Trip <span id="trip-id-value"></span></legend>
    <div class="trip-detail"><b>Date:</b> <span id="trip-date-value"></span></div>
    <div class="trip-detail"><b>Pickup:</b> <span id="pickup-time-value"></span> — <a id="pickup-location-value" target="_blank" rel="noopener"></a></div>
    <div class="trip-detail"><b>Dropoff:</b> <a id="dropoff-location-value" target="_blank" rel="noopener"></a></div>
    <div class="trip-detail"><b>Duration:</b> <span id="duration-value"></span></div>
  </fieldset>

  <fieldset id="picker-fieldset" class="hidden">
    <legend>Who are you?</legend>
    <p><small>Select your name from the roster.</small></p>
    <div class="driver-list" id="driver-list"></div>
  </fieldset>

  <fieldset id="confirm-fieldset" class="hidden">
    <legend>Confirm it's you</legend>
    <p>Selected: <b id="confirm-driver-name"></b> <button class="secondary" id="confirm-change-name" style="margin-top:0; padding:0.2rem 0.5rem;">change</button></p>
    <label for="last4-input">Last 4 digits of your phone number</label>
    <input type="tel" id="last4-input" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="1234">
  </fieldset>

  <fieldset id="action-fieldset" class="hidden">
    <legend>Your response</legend>
    <div class="row">
      <button class="primary" id="accept-btn">Accept</button>
      <button class="danger" id="decline-btn">Decline</button>
    </div>
  </fieldset>
</div>

<script>
(function () {
  const cfg = window.APP_CONFIG;
  const $ = (id) => document.getElementById(id);

  // ---- State ----
  const params = new URLSearchParams(location.search);
  const tripId = params.get('tripId');
  const driverId = params.get('driverId'); // present only on personalized links
  const riderId = params.get('riderId'); // present only on rider roster links
  const escortId = params.get('escortId'); // present only on vehicle escort roster links
  const respondAs = params.get('respondAs'); // 'rider' | 'escort' — picker fallback when no riderId/escortId/driverId
  let tripStatus = null;
  let selectedRole = null; // 'driver' | 'rider' | 'escort', set once a picker name is chosen
  let selectedName = null;

  if (!cfg || !cfg.sharedSecret) {
    showMessage('error', 'config.js is missing or incomplete. Copy config.example.js to config.js and fill in real values.');
  } else if (!tripId) {
    showMessage('error', 'No trip specified in this link.');
  } else {
    loadTrip();
  }

  // ---- Load trip details ----
  function loadTrip() {
    showMessage('info', 'Loading trip ' + tripId + '...');
    const url = cfg.lookupWebhookUrl + '?tripId=' + encodeURIComponent(tripId);
    fetch(url, { headers: { 'X-Dispatch-Secret': cfg.sharedSecret } })
      .then((res) => {
        if (res.status === 404) throw new Error('Trip ' + tripId + ' not found.');
        if (!res.ok) throw new Error('Lookup failed (' + res.status + ').');
        return res.json();
      })
      .then((trip) => {
        tripStatus = trip.status;
        $('trip-id-value').textContent = trip.tripId;
        $('trip-date-value').textContent = trip.tripDate || '';
        $('pickup-time-value').textContent = trip.pickupTime || '';
        const pickupEl = $('pickup-location-value');
        pickupEl.textContent = trip.pickupLocation || '';
        pickupEl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(trip.pickupLocation || '');
        const dropoffEl = $('dropoff-location-value');
        dropoffEl.textContent = trip.dropoffLocation || '';
        dropoffEl.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(trip.dropoffLocation || '');
        $('duration-value').textContent = formatDuration(trip.durationMin);
        $('trip-fieldset').classList.remove('hidden');
        clearMessage();

        if (trip.status === 'Cancelled') {
          showMessage('info', 'This trip has been cancelled — no response needed.');
          return;
        }

        if (riderId) {
          // Rider roster link: one link per person, not per-slot — the
          // backend tries Slot 1 then Slot 2 on accept. No last-4 check
          // (the link was texted privately to this person's own phone).
          const rider1Open = trip.riderStatus1 === 'Open';
          const rider2Open = trip.riderStatus2 === 'Open';
          const ridersEverNeeded = !!(trip.riderStatus1 || trip.riderStatus2);
          if (!rider1Open && !rider2Open) {
            showMessage('info', ridersEverNeeded
              ? 'Sorry, this trip\'s rider slots are already full.'
              : 'This trip does not need riders.');
            return;
          }
          $('action-fieldset').classList.remove('hidden');
          return;
        }

        if (escortId) {
          if (trip.escortStatus !== 'Open') {
            showMessage('info', trip.escortStatus === 'Filled'
              ? 'Sorry, this trip\'s vehicle escort slot has already been filled.'
              : 'This trip does not need a vehicle escort.');
            return;
          }
          $('action-fieldset').classList.remove('hidden');
          return;
        }

        if (respondAs === 'rider') {
          const rider1Open = trip.riderStatus1 === 'Open';
          const rider2Open = trip.riderStatus2 === 'Open';
          const ridersEverNeeded = !!(trip.riderStatus1 || trip.riderStatus2);
          if (!rider1Open && !rider2Open) {
            showMessage('info', ridersEverNeeded
              ? 'Sorry, this trip\'s rider slots are already full.'
              : 'This trip does not need riders.');
            return;
          }
          loadRoster('rider');
          return;
        }

        if (respondAs === 'escort') {
          if (trip.escortStatus !== 'Open') {
            showMessage('info', trip.escortStatus === 'Filled'
              ? 'Sorry, this trip\'s vehicle escort slot has already been filled.'
              : 'This trip does not need a vehicle escort.');
            return;
          }
          loadRoster('escort');
          return;
        }

        if (trip.status === 'Filled') {
          if (driverId && trip.pendingReconfirmation) {
            showMessage('info', 'This trip\'s details changed since you accepted — please reconfirm or decline.');
            $('action-fieldset').classList.remove('hidden');
            return;
          }
          showMessage('info', 'Sorry, this trip has already been taken by another driver.');
          return;
        }

        if (driverId) {
          // Personalized link: identity already proven by the private SMS link.
          $('action-fieldset').classList.remove('hidden');
        } else {
          // Calendar-origin link: pick name, then confirm last 4 of phone.
          loadRoster('driver');
        }
      })
      .catch((err) => showMessage('error', err.message));
  }

  // ---- Picker fallback: pick a name from the roster, then confirm last 4 ----
  const ROSTER_CONFIG = {
    driver: { url: () => cfg.driversWebhookUrl, label: 'driver' },
    rider: { url: () => cfg.ridersWebhookUrl, label: 'rider' },
    escort: { url: () => cfg.escortsWebhookUrl, label: 'vehicle escort' }
  };

  function loadRoster(role) {
    const roster = ROSTER_CONFIG[role];
    fetch(roster.url(), { headers: { 'X-Dispatch-Secret': cfg.sharedSecret } })
      .then((res) => {
        if (!res.ok) throw new Error('Could not load ' + roster.label + ' roster (' + res.status + ').');
        return res.json();
      })
      .then((people) => {
        const list = $('driver-list');
        list.innerHTML = '';
        people.forEach((p) => {
          const btn = document.createElement('button');
          btn.className = 'secondary';
          btn.textContent = p.name;
          btn.addEventListener('click', () => selectPerson(role, p.name));
          list.appendChild(btn);
        });
        $('picker-fieldset').classList.remove('hidden');
      })
      .catch((err) => showMessage('error', err.message));
  }

  function selectPerson(role, name) {
    selectedRole = role;
    selectedName = name;
    $('confirm-driver-name').textContent = name;
    $('picker-fieldset').classList.add('hidden');
    $('confirm-fieldset').classList.remove('hidden');
    $('action-fieldset').classList.remove('hidden');
  }

  $('confirm-change-name').addEventListener('click', () => {
    selectedName = null;
    $('last4-input').value = '';
    $('confirm-fieldset').classList.add('hidden');
    $('action-fieldset').classList.add('hidden');
    $('picker-fieldset').classList.remove('hidden');
  });

  // ---- Accept / Decline ----
  $('accept-btn').addEventListener('click', () => respond('accept'));
  $('decline-btn').addEventListener('click', () => respond('decline'));

  function respond(action) {
    const payload = { tripId, action };
    if (riderId) {
      payload.riderId = riderId;
    } else if (escortId) {
      payload.escortId = escortId;
    } else if (driverId) {
      payload.driverId = driverId;
    } else {
      const last4 = $('last4-input').value.trim();
      if (!selectedName) {
        showMessage('error', 'Select your name first.');
        return;
      }
      if (!/^\d{4}$/.test(last4)) {
        showMessage('error', 'Enter the last 4 digits of your phone number.');
        return;
      }
      if (selectedRole === 'rider') payload.riderName = selectedName;
      else if (selectedRole === 'escort') payload.escortName = selectedName;
      else payload.driverName = selectedName;
      payload.last4 = last4;
    }

    setActionButtons(true);
    showMessage('info', action === 'accept' ? 'Submitting acceptance...' : 'Submitting decline...');
    fetch(cfg.respondWebhookUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Dispatch-Secret': cfg.sharedSecret
      },
      body: JSON.stringify(payload)
    })
      .then((res) => res.json().then((body) => ({ ok: res.ok, status: res.status, body })))
      .then(({ ok, status, body }) => {
        if (!ok) {
          throw new Error(body.message || (status === 409 ? 'Sorry, already taken.' : 'Request failed.'));
        }
        showMessage('success', body.message || 'Response recorded.');
        $('action-fieldset').classList.add('hidden');
        $('confirm-fieldset').classList.add('hidden');
        $('picker-fieldset').classList.add('hidden');
      })
      .catch((err) => {
        showMessage('error', err.message);
        setActionButtons(false);
      });
  }

  function setActionButtons(disabled) {
    $('accept-btn').disabled = disabled;
    $('decline-btn').disabled = disabled;
  }

  // ---- Helpers ----
  function formatDuration(durationMin) {
    const total = Number(durationMin) || 0;
    const h = Math.floor(total / 60);
    const m = total % 60;
    if (h && m) return h + 'h ' + m + 'm';
    if (h) return h + 'h';
    return m + 'm';
  }
  function showMessage(type, text) {
    const el = $('message');
    el.className = type;
    el.textContent = text;
  }
  function clearMessage() {
    const el = $('message');
    el.className = '';
    el.textContent = '';
  }
})();
</script>
</body>
</html>
