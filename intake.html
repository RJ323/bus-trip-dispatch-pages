<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Intake — Dispatch</title>
<script src="config.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --ink: #0f1f3d;
    --ink-2: #16294d;
    --blue: #2563eb;
    --amber: #f59e0b;
    --paper: #f7f7f5;
    --slate: #475569;
    --slate-light: #94a3b8;
    --card: #ffffff;
    --card-border: #e2e2df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0b1220;
      --card: #12203a;
      --card-border: #24334f;
      --slate: #b8c4d6;
      --slate-light: #7488a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    line-height: 1.45;
    background: var(--paper);
    color: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e7ebf3; }
  }
  a { color: var(--blue); }
  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", monospace;
  }

  .console-header {
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    display: flex;
    justify-content: center;
    padding: 1.25rem 1rem;
  }
  .console-header img {
    display: block;
    max-width: 480px;
    width: 100%;
    height: auto;
  }
  .console-eyebrow {
    max-width: 480px;
    margin: 0 auto;
    padding: 0.9rem 1rem 0 1rem;
    text-align: center;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .page-content { max-width: 480px; margin: 0 auto; padding: 1rem 1rem 3rem; }

  #message {
    margin: 0 0 1rem;
    padding: 0.75rem 0.9rem;
    border-radius: 4px;
    border-left: 3px solid transparent;
    display: none;
    font-size: 0.92rem;
  }
  #message.info { display: block; background: #2563eb14; border-color: var(--blue); }
  #message.error { display: block; background: #dc262614; border-color: #dc2626; }
  #message.success { display: block; background: #16a34a14; border-color: #16a34a; }

  fieldset {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin: 0 0 1rem;
    background: var(--card);
  }
  legend {
    padding: 0 0.4rem;
    font-weight: 800;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
  }
  label { display: block; margin: 0.75rem 0 0.3rem; font-weight: 600; font-size: 0.85rem; color: var(--slate); }
  input, select {
    width: 100%; box-sizing: border-box; padding: 0.6rem 0.7rem; font-size: 1rem;
    border: 1px solid var(--card-border); border-radius: 6px; background: transparent; color: inherit;
    margin-top: 0.75rem;
  }
  input[type="checkbox"] {
    width: auto; padding: 0; border: none; background: none; margin-right: 0.4rem; margin-top: 0; vertical-align: middle;
  }
  input::placeholder { color: var(--slate-light); opacity: 1; }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  button {
    font-size: 0.95rem; font-weight: 700; padding: 0.75rem 1rem; border-radius: 8px; border: none;
    cursor: pointer; margin-top: 0.75rem; letter-spacing: 0.01em;
  }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .primary { background: var(--blue); color: #fff; }
  .danger { background: transparent; color: #dc2626; border: 1.5px solid #dc2626; }
  .secondary { background: transparent; color: inherit; border: 1.5px solid var(--card-border); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .row > button, .row > div { flex: 1; }
  .hidden { display: none !important; }
  small { opacity: 0.75; }

  .stamp-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: 2px solid var(--amber);
    color: var(--amber);
    border-radius: 6px;
    padding: 0.3rem 0.65rem;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transform: rotate(-2deg);
  }
  .stamp-badge.status-open { border-color: var(--amber); color: var(--amber); }
  .stamp-badge.status-filled { border-color: #16a34a; color: #16a34a; }
  .stamp-badge.status-cancelled { border-color: #b91c1c; color: #b91c1c; }

  .cancelled-stamp {
    position: absolute;
    top: 34%;
    left: 0;
    right: 0;
    text-align: center;
    transform: rotate(-8deg);
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 0.12em;
    color: #dc2626;
    border-top: 4px solid #dc2626;
    border-bottom: 4px solid #dc2626;
    padding: 0.3rem 0;
    background: rgba(220,38,38,0.1);
    pointer-events: none;
    z-index: 5;
    text-transform: uppercase;
  }

  .filled-name { color: #16a34a; font-weight: 800; }

  .gate-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-top: 1rem;
    text-align: center;
  }

  @media (prefers-reduced-motion: no-preference) {
    fieldset { animation: rise 0.25s ease-out; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!--
  Front-end <-> n8n contract this page relies on (Step 3 of the build order
  implements the n8n side of this):

  GET  {lookupWebhookUrl}?tripId=T-0001
       Header: X-Dispatch-Secret: <sharedSecret>
       200 -> { tripId, tripDate, pickupTime, pickupLocation, dropoffLocation,
                durationMin, status, riderName1, riderPhone1, riderStatus1,
                riderName2, riderPhone2, riderStatus2,
                escortName, escortPhone, escortStatus }
       404 -> trip not found

  GET  {tripsListWebhookUrl}   (no params)
       Header: X-Dispatch-Secret: <sharedSecret>
       200 -> [ { tripId, tripDate, pickupTime, pickupLocation, status }, ... ]
              Upcoming (tripDate >= today), non-cancelled trips only, sorted
              by date then pickup time. Powers the "Load Existing Trip"
              picker below instead of requiring staff to know the trip ID.

  POST {intakeWebhookUrl}
       Header: X-Dispatch-Secret: <sharedSecret>
       Body (create): { action: 'create', tripDate, pickupTime,
                         pickupLocation, dropoffLocation, durationMin,
                         rider1Needed?, rider2Needed?, escortNeeded? }
       Body (update): body above + { action: 'update', tripId }
       Body (cancel): { action: 'cancel', tripId }
       200 -> { tripId, status, message }
       4xx -> { message } (e.g. already Filled, validation failure)

  Riders (up to 2 independent slots) and the vehicle escort work like
  drivers, not like a typed-in name: staff just flags each slot as needed
  (rider1Needed/rider2Needed/escortNeeded booleans — no name/phone entered
  here; rider2Needed is only meaningful when rider1Needed is also true —
  most trips need just one rider, so leaving the 2nd rider box unchecked
  keeps that slot blank/not-needed instead of sitting "Open" forever with
  no one ever expected to fill it), n8n broadcasts to the Riders/Vehicle
  Escorts roster the same way it broadcasts to Drivers, and the first
  roster member to accept locks that slot (riderName1/2, escortName etc.
  are then system-filled from whoever accepted).
  riderStatus1/2 and escortStatus are blank (not needed), 'Open'
  (broadcasting), or 'Filled'.
-->

<header class="console-header">
  <img src="banner.png" alt="Trip Dispatch">
</header>
<div class="console-eyebrow">Bus Trip Intake Form</div>

<div id="gate" class="page-content">
  <div class="gate-card">
    <p style="margin-top:0;">Enter passphrase to continue.</p>
    <input type="password" id="gate-input" placeholder="Passphrase" autocomplete="off">
    <button class="primary" id="gate-submit" style="width:100%;">Enter</button>
    <div id="gate-error" class="hidden" style="color:#dc2626; margin-top:0.5rem; font-size:0.85rem;">Incorrect passphrase.</div>
    <p style="text-align:center; font-size:0.95rem; margin:0.75rem 0 0;"><a href="home.html">&larr; Back</a></p>
  </div>
</div>

<div id="app" class="page-content hidden">
  <div class="row">
    <button class="secondary" id="mode-create">Create New Trip</button>
    <button class="secondary" id="mode-edit">Load Existing Trip</button>
  </div>
  <p style="text-align:center; font-size:0.95rem; margin:0 0 1.25rem;"><a href="home.html">&larr; Back</a></p>

  <div id="message"></div>

  <fieldset id="lookup-fieldset" class="hidden">
    <legend>Find Trip</legend>
    <select id="lookup-trip-id" class="mono" aria-label="Trip"></select>
    <button class="primary" id="lookup-submit">Load Trip</button>
  </fieldset>

  <form id="trip-form" class="hidden">
    <fieldset>
      <legend id="form-legend">New Trip</legend>

      <div id="cancelled-stamp" class="cancelled-stamp hidden">Canceled</div>

      <div id="trip-id-display" class="hidden" style="margin-bottom:0.5rem;">
        <span class="mono" id="trip-id-value" style="font-weight:700;"></span>
        <span id="trip-status-value" class="stamp-badge"></span>
        <div><small id="driver-status-display"></small></div>
      </div>

      <input type="date" id="trip-date" placeholder="Trip Date" aria-label="Trip Date" required>

      <input type="time" id="pickup-time" placeholder="Pickup Time" aria-label="Pickup Time" required>

      <label for="pickup-location">Pickup Location</label>
      <input type="text" id="pickup-location" placeholder="Pickup Location" aria-label="Pickup Location" required>

      <label for="dropoff-location">Dropoff Location</label>
      <input type="text" id="dropoff-location" placeholder="Dropoff Location" aria-label="Dropoff Location" required>

      <input type="number" id="duration-hours" min="1" step="1" placeholder="Duration (Hours)" inputmode="numeric" aria-label="Duration in hours">
      <small>Estimated trip duration, in hours — actual time may vary.</small>
    </fieldset>

    <fieldset>
      <legend>Riders (optional, up to 2)</legend>

      <label><input type="checkbox" id="rider1-toggle"> Rider needed</label>
      <label><input type="checkbox" id="rider2-toggle" disabled> 2nd rider needed</label>
      <small id="riders-status-display"></small>
    </fieldset>

    <fieldset>
      <legend>Vehicle Escort (optional)</legend>

      <label><input type="checkbox" id="escort-toggle"> Escort needed</label>
      <small id="escort-status-display"></small>
    </fieldset>

    <div class="row">
      <button type="submit" class="primary" id="save-btn">Save Trip</button>
      <button type="button" class="danger hidden" id="cancel-trip-btn">Cancel Trip</button>
    </div>
  </form>
</div>

<script>
(function () {
  const cfg = window.APP_CONFIG;
  const $ = (id) => document.getElementById(id);

  // Capitalizes just the first letter of each word (street name, road/circle/
  // etc. suffix, city, state) — leaves everything else exactly as typed, so
  // "5290 griggs rd houston, tx" becomes "5290 Griggs Rd Houston, Tx" without
  // forcing state abbreviations or the rest of any word to a different case.
  function capitalizeAddressWords(str) {
    return str.replace(/\b\w/g, (c) => c.toUpperCase());
  }

  // ---- Gate ----
  const gate = $('gate'), app = $('app');
  if (!cfg || !cfg.sharedSecret) {
    gate.innerHTML = '<p style="color:#dc2626;">config.js is missing or incomplete. Copy config.example.js to config.js and fill in real values.</p>';
  } else if (sessionStorage.getItem('dispatchGateOk') === '1') {
    showApp();
  }

  $('gate-submit').addEventListener('click', () => {
    if ($('gate-input').value === cfg.sharedSecret) {
      sessionStorage.setItem('dispatchGateOk', '1');
      showApp();
    } else {
      $('gate-error').classList.remove('hidden');
    }
  });

  function showApp() {
    gate.classList.add('hidden');
    app.classList.remove('hidden');
    const params = new URLSearchParams(location.search);
    const tripId = params.get('tripId');
    if (tripId) {
      switchMode('edit');
      loadTrip(tripId);
    }
  }

  // ---- Mode switching ----
  let mode = null; // 'create' | 'edit'
  let loadedTripId = null;

  $('pickup-location').addEventListener('blur', (e) => {
    e.target.value = capitalizeAddressWords(e.target.value);
  });
  $('dropoff-location').addEventListener('blur', (e) => {
    e.target.value = capitalizeAddressWords(e.target.value);
  });

  $('mode-create').addEventListener('click', () => switchMode('create'));
  $('mode-edit').addEventListener('click', () => switchMode('edit'));

  $('rider1-toggle').addEventListener('change', () => {
    const needed = $('rider1-toggle').checked;
    $('rider2-toggle').disabled = !needed;
    if (!needed) $('rider2-toggle').checked = false;
  });

  function switchMode(next) {
    mode = next;
    loadedTripId = null;
    clearMessage();
    $('trip-form').reset();
    $('trip-form').classList.add('hidden');
    $('trip-id-display').classList.add('hidden');
    $('cancel-trip-btn').classList.add('hidden');
    $('cancelled-stamp').classList.add('hidden');
    $('save-btn').disabled = false;
    $('riders-status-display').innerHTML = '';
    $('escort-status-display').innerHTML = '';
    $('driver-status-display').innerHTML = '';
    $('rider2-toggle').disabled = true;
    if (mode === 'create') {
      $('lookup-fieldset').classList.add('hidden');
      $('form-legend').textContent = 'New Trip';
      $('trip-form').classList.remove('hidden');
    } else {
      $('lookup-fieldset').classList.remove('hidden');
      loadTripsList();
    }
  }

  // ---- Lookup existing trip ----
  function loadTripsList() {
    const select = $('lookup-trip-id');
    select.innerHTML = '<option value="">Loading trips…</option>';
    select.disabled = true;
    fetch(cfg.tripsListWebhookUrl, { headers: { 'X-Dispatch-Secret': cfg.sharedSecret } })
      .then((res) => {
        if (!res.ok) throw new Error('Could not load trip list (' + res.status + ').');
        return res.json();
      })
      .then((trips) => {
        select.innerHTML = '';
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = trips.length ? 'Select a trip…' : 'No upcoming trips';
        placeholder.disabled = true;
        placeholder.selected = true;
        select.appendChild(placeholder);
        trips.forEach((trip) => {
          const opt = document.createElement('option');
          opt.value = trip.tripId;
          const prefix = trip.status === 'Cancelled' ? 'CANCELED — ' : '';
          opt.textContent = prefix + trip.tripId + ' · ' + formatDateMMDDYYYY(trip.tripDate) + ' ' + formatTime12Hour(trip.pickupTime) + ' · ' + trip.pickupLocation.split(',')[0];
          select.appendChild(opt);
        });
        select.disabled = false;
      })
      .catch((err) => {
        select.innerHTML = '<option value="">Could not load trips</option>';
        showMessage('error', err.message);
      });
  }

  $('lookup-submit').addEventListener('click', () => {
    const tripId = $('lookup-trip-id').value.trim();
    if (!tripId) return;
    loadTrip(tripId);
  });

  function loadTrip(tripId) {
    showMessage('info', 'Loading trip ' + tripId + '...');
    const url = cfg.lookupWebhookUrl + '?tripId=' + encodeURIComponent(tripId);
    fetch(url, { headers: { 'X-Dispatch-Secret': cfg.sharedSecret } })
      .then((res) => {
        if (res.status === 404) throw new Error('Trip ' + tripId + ' not found.');
        if (!res.ok) throw new Error('Lookup failed (' + res.status + ').');
        return res.json();
      })
      .then((trip) => {
        loadedTripId = trip.tripId;
        $('trip-date').value = trip.tripDate || '';
        $('pickup-time').value = trip.pickupTime || '';
        $('pickup-location').value = trip.pickupLocation || '';
        $('dropoff-location').value = trip.dropoffLocation || '';
        const durMin = trip.durationMin || 0;
        $('duration-hours').value = durMin ? Math.round(durMin / 60) : '';
        $('rider1-toggle').checked = !!trip.riderStatus1;
        $('rider2-toggle').disabled = !trip.riderStatus1;
        $('rider2-toggle').checked = !!trip.riderStatus2;
        $('riders-status-display').innerHTML =
          describeSlot('Rider 1', trip.riderStatus1, trip.riderName1) +
          describeSlot('Rider 2', trip.riderStatus2, trip.riderName2);
        $('escort-toggle').checked = !!trip.escortStatus;
        $('escort-status-display').innerHTML = describeSlot('Escort', trip.escortStatus, trip.escortName);
        $('trip-id-value').textContent = trip.tripId;
        const statusEl = $('trip-status-value');
        // The big diagonal "Canceled" banner already covers the cancelled
        // case — showing this small badge too was redundant.
        if (trip.status === 'Cancelled') {
          statusEl.textContent = '';
          statusEl.className = 'stamp-badge hidden';
        } else {
          statusEl.textContent = trip.status;
          statusEl.className = 'stamp-badge status-' + String(trip.status).toLowerCase();
        }
        $('driver-status-display').innerHTML = trip.status === 'Filled' && trip.driverName
          ? 'Driver: <span class="filled-name">' + escapeHtml(trip.driverName) + '</span>'
          : '';
        $('trip-id-display').classList.remove('hidden');
        $('form-legend').textContent = 'Edit Trip';
        $('cancel-trip-btn').classList.toggle('hidden', trip.status === 'Cancelled');
        $('cancelled-stamp').classList.toggle('hidden', trip.status !== 'Cancelled');
        $('save-btn').disabled = trip.status === 'Cancelled';
        $('trip-form').classList.remove('hidden');
        clearMessage();
      })
      .catch((err) => showMessage('error', err.message));
  }

  // ---- Save (create or update) ----
  $('trip-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const durationMin = (Number($('duration-hours').value) || 0) * 60;
    if (durationMin <= 0) {
      showMessage('error', 'Enter a trip duration greater than 0.');
      return;
    }
    const payload = {
      action: mode === 'edit' && loadedTripId ? 'update' : 'create',
      tripDate: $('trip-date').value,
      pickupTime: $('pickup-time').value,
      pickupLocation: capitalizeAddressWords($('pickup-location').value.trim()),
      dropoffLocation: capitalizeAddressWords($('dropoff-location').value.trim()),
      durationMin: durationMin,
      rider1Needed: $('rider1-toggle').checked,
      rider2Needed: $('rider1-toggle').checked && $('rider2-toggle').checked,
      escortNeeded: $('escort-toggle').checked
    };
    if (payload.action === 'update') payload.tripId = loadedTripId;

    setSaving(true);
    showMessage('info', 'Saving...');
    fetch(cfg.intakeWebhookUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Dispatch-Secret': cfg.sharedSecret
      },
      body: JSON.stringify(payload)
    })
      .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) throw new Error(body.message || 'Save failed.');
        showMessage('success', body.message || ('Trip ' + body.tripId + ' saved.'));
      })
      .catch((err) => showMessage('error', err.message))
      .finally(() => setSaving(false));
  });

  // ---- Cancel trip ----
  $('cancel-trip-btn').addEventListener('click', () => {
    if (!loadedTripId) return;
    if (!confirm('Cancel trip ' + loadedTripId + '? This cannot be undone from this form.')) return;
    showMessage('info', 'Cancelling...');
    fetch(cfg.intakeWebhookUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Dispatch-Secret': cfg.sharedSecret
      },
      body: JSON.stringify({ action: 'cancel', tripId: loadedTripId })
    })
      .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
      .then(({ ok, body }) => {
        if (!ok) throw new Error(body.message || 'Cancel failed.');
        showMessage('success', body.message || ('Trip ' + loadedTripId + ' cancelled.'));
      })
      .catch((err) => showMessage('error', err.message));
  });

  // ---- Helpers ----
  function describeSlot(label, status, name) {
    if (!status) return '';
    if (status === 'Filled') return label + ': <span class="filled-name">' + escapeHtml(name || 'unknown') + '</span>  ';
    return label + ': Open — awaiting response  ';
  }
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  function formatDateMMDDYYYY(isoDate) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDate || '');
    return m ? m[2] + '-' + m[3] + '-' + m[1] : (isoDate || '');
  }
  function formatTime12Hour(time24) {
    const m = /^(\d{1,2}):(\d{2})/.exec(time24 || '');
    if (!m) return time24 || '';
    let hour = parseInt(m[1], 10);
    const ampm = hour >= 12 ? 'PM' : 'AM';
    hour = hour % 12 || 12;
    return hour + ':' + m[2] + ' ' + ampm;
  }
  function setSaving(saving) {
    $('save-btn').disabled = saving;
  }
  function showMessage(type, text) {
    const el = $('message');
    el.className = type;
    el.textContent = text;
  }
  function clearMessage() {
    const el = $('message');
    el.className = '';
    el.textContent = '';
  }
})();
</script>
</body>
</html>
