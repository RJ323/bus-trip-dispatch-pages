<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Dispatch</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #0f1f3d;
    --ink-2: #16294d;
    --blue: #2563eb;
    --paper: #0b1220;
    --slate: #b8c4d6;
    --slate-light: #7488a6;
    --card: #12203a;
    --card-border: #24334f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    line-height: 1.45;
    background: var(--paper);
    color: #e7ebf3;
  }
  a { color: var(--blue); }

  .console-header {
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    display: flex;
    justify-content: center;
    padding: 1.25rem 1rem;
  }
  .console-header img {
    display: block;
    max-width: 480px;
    width: 100%;
    height: auto;
  }
  .console-eyebrow {
    max-width: 480px;
    margin: 0 auto;
    padding: 0.9rem 1rem 0 1rem;
    text-align: center;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--slate-light);
  }

  .page-content { max-width: 480px; margin: 0 auto; padding: 1rem 1rem 3rem; }

  .account-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-top: 1rem;
    text-align: center;
  }
  .account-card h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 0.6rem; }
  .account-card p { margin: 0 0 1.25rem; color: var(--slate); }
  .account-card p:last-child { margin-bottom: 0; }

  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .row > a { flex: 1; }
  a.secondary {
    display: block;
    font-size: 0.95rem; font-weight: 700; padding: 0.75rem 1rem; border-radius: 8px;
    background: transparent; color: inherit; border: 1.5px solid var(--card-border);
    text-decoration: none; letter-spacing: 0.01em;
  }
  a.secondary:hover { border-color: var(--blue); color: var(--blue); }

  @media (prefers-reduced-motion: no-preference) {
    .account-card { animation: rise 0.25s ease-out; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header class="console-header">
  <img src="banner.png" alt="Trip Dispatch">
</header>
<div class="console-eyebrow">Trip Dispatch</div>

<div class="page-content">
  <div class="account-card">
    <h1>Trip Dispatch</h1>
    <p>Choose the area you have access to.</p>
    <div class="row">
      <a class="secondary" href="intake.html">Trip Intake (Staff)</a>
      <a class="secondary" href="auth.html">Account Access</a>
    </div>
    <div style="text-align:center; margin-top:0.75rem;">
      <a class="secondary" href="scheduled-trips.html" style="display:inline-block; padding-left:2.25rem; padding-right:2.25rem;">Scheduled Trips</a>
    </div>
    <div class="row" style="margin-top:0.75rem;">
      <a class="secondary" href="index.html">Exit</a>
    </div>
    <p style="text-align:center; font-size:0.95rem; margin:0.75rem 0 0;"><a href="index.html">&larr; Back</a></p>
  </div>
</div>

</body>
</html>
