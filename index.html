<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Dispatch</title>
<style>
  :root {
    color-scheme: dark;
    --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    line-height: 1.45;
  }

  .landing-bg {
    position: relative;
    min-height: 100vh;
    background-color: #0b1220;
    background-image:
      linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28)),
      url("background.jpeg");
    background-size: cover;
    background-position: center;
  }
  /* Below ~700px wide (phones in portrait, where the viewport is much
     taller than it is wide), "cover" has to scale the landscape photo up
     so much to fill the height that most of the bus's width gets cropped
     off-screen. Switch to "contain" here so the whole photo stays visible
     — background-color above fills the letterboxed space above/below it
     instead of leaving it blank/white. Wider viewports (tablet/desktop,
     and phones in landscape) are close enough to the photo's own aspect
     ratio that "cover" barely crops anything, so they keep the full-bleed
     look. */
  @media (max-width: 700px) {
    .landing-bg {
      background-size: contain;
      background-repeat: no-repeat;
    }
  }

  .bottom-panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 4rem 1.25rem 2rem;
    background: linear-gradient(to top, rgba(8,12,20,0.92) 0%, rgba(8,12,20,0.75) 45%, rgba(8,12,20,0) 100%);
    text-align: center;
  }
  .panel-inner { max-width: 420px; margin: 0 auto; }
  .bottom-panel h1 {
    color: #fbbf24;
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 0.5rem;
    text-shadow: 0 1px 5px rgba(0,0,0,0.55);
  }
  .bottom-panel p {
    color: #fbbf24;
    font-size: 0.9rem;
    margin: 0 0 1.25rem;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .row { display: flex; gap: 0.6rem; }
  .row > a { flex: 1; }
  a.primary {
    display: block;
    font-size: 0.95rem; font-weight: 700; padding: 0.8rem 1rem; border-radius: 8px;
    background: var(--blue); color: #fff; border: 1.5px solid var(--blue);
    text-decoration: none; letter-spacing: 0.01em;
  }
  a.primary:hover { opacity: 0.92; }
  a.secondary {
    display: block;
    font-size: 0.95rem; font-weight: 700; padding: 0.8rem 1rem; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: #fff; border: 1.5px solid rgba(255,255,255,0.55);
    text-decoration: none; letter-spacing: 0.01em;
    backdrop-filter: blur(2px);
  }
  a.secondary:hover { background: rgba(255,255,255,0.16); border-color: #fff; }
</style>
</head>
<body>

<div class="landing-bg">
  <div class="bottom-panel">
    <div class="panel-inner">
      <h1>Trip Dispatch</h1>
      <p>This system is for authorized personnel only. If you were not sent a link directly, or you do not otherwise have access, please exit.</p>
      <div class="row">
        <a class="primary" href="home.html">Enter</a>
        <a class="secondary" href="https://www.google.com">Exit</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
