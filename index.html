<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Dispatch</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    line-height: 1.45;
  }

  .landing-bg {
    position: relative;
    min-height: 100vh;
    background-color: #0b1220;
    background-image:
      linear-gradient(rgba(0,0,0,0.28), rgba(0,0,0,0.28)),
      url("background.jpeg");
    background-size: cover;
    background-position: center;
  }
  /* Below ~700px wide (phones in portrait, where the viewport is much
     taller than it is wide), "cover" has to scale the landscape photo up
     so much to fill the height that most of the bus's width gets cropped
     off-screen. Switch to "contain" here so the whole photo stays visible
     — background-color above fills the letterboxed space above/below it
     instead of leaving it blank/white. Wider viewports (tablet/desktop,
     and phones in landscape) are close enough to the photo's own aspect
     ratio that "cover" barely crops anything, so they keep the full-bleed
     look. */
  @media (max-width: 700px) {
    .landing-bg {
      background-size: contain;
      background-repeat: no-repeat;
    }
  }

  .bottom-panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 4rem 1.25rem 2rem;
    background: linear-gradient(to top, rgba(8,12,20,0.92) 0%, rgba(8,12,20,0.75) 45%, rgba(8,12,20,0) 100%);
    text-align: center;
  }
  .panel-inner { max-width: 420px; margin: 0 auto; }
  .bottom-panel h1 {
    color: #fbbf24;
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 0.5rem;
    text-shadow: 0 1px 5px rgba(0,0,0,0.55);
  }
  .bottom-panel p {
    color: #fbbf24;
    font-size: 0.9rem;
    margin: 0 0 1.25rem;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .row { display: flex; gap: 0.6rem; }
  .row > a { flex: 1; }

  /* "Beacon" buttons: a police-light-style pair — one glows red, one
     glows blue, and they swap on every half-cycle so together they
     strobe like an alternating light bar. */
  .beacon-btn {
    position: relative;
    display: block;
    border-radius: 11px;
    padding: 0.8rem 1rem;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
    text-decoration: none;
    text-align: center;
    overflow: hidden;
    background: radial-gradient(150% 180% at 11% 140%, var(--c1) 0%, var(--c2) 55%, var(--c3) 100%);
  }
  .beacon-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1.5px;
    background: linear-gradient(20deg, var(--b1), var(--b2));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }
  .beacon-btn:hover { filter: brightness(1.12); }

  .beacon-red {
    --c1: #7f0a1e; --c2: #dc2626; --c3: #2a0509;
    --b1: hsla(0, 85%, 65%, 0.2); --b2: hsla(0, 85%, 55%, 0.75);
    animation: beacon-strobe-red 0.32s steps(1, end) infinite;
  }
  .beacon-blue {
    --c1: #0a1a7f; --c2: #2563eb; --c3: #05092a;
    --b1: hsla(220, 85%, 65%, 0.2); --b2: hsla(220, 85%, 55%, 0.75);
    animation: beacon-strobe-blue 0.32s steps(1, end) infinite;
  }
  @keyframes beacon-strobe-red {
    0%, 45% { filter: brightness(1.3) saturate(1.25); }
    50%, 100% { filter: brightness(0.55) saturate(0.7); }
  }
  @keyframes beacon-strobe-blue {
    0%, 45% { filter: brightness(0.55) saturate(0.7); }
    50%, 100% { filter: brightness(1.3) saturate(1.25); }
  }
  @media (prefers-reduced-motion: reduce) {
    .beacon-red, .beacon-blue { animation: none; }
  }
</style>
</head>
<body>

<div class="landing-bg">
  <div class="bottom-panel">
    <div class="panel-inner">
      <h1>Trip Dispatch</h1>
      <p>This system is for authorized personnel only. If you were not sent a link directly, or you do not otherwise have access, please exit.</p>
      <div class="row">
        <a class="beacon-btn beacon-red" href="home.html">Enter</a>
        <a class="beacon-btn beacon-blue" href="https://www.google.com">Exit</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
