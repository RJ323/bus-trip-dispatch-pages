<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Dispatch</title>
<style>
  :root {
    color-scheme: dark;
    --blue: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    line-height: 1.45;
  }

  .landing-bg {
    position: relative;
    min-height: 100vh;
    background-image:
      linear-gradient(rgba(10,14,23,0.32), rgba(10,14,23,0.32)),
      url("background.jpeg");
    background-size: cover;
    background-position: center;
  }

  .overlay-panel {
    position: absolute;
    left: 0; right: 0;
    top: 40%;
    padding: 2rem 1.25rem;
    background: linear-gradient(to bottom, rgba(8,12,20,0) 0%, rgba(8,12,20,0.88) 22%, rgba(8,12,20,0.88) 78%, rgba(8,12,20,0) 100%);
    text-align: center;
  }
  .panel-inner { max-width: 420px; margin: 0 auto; }
  .overlay-panel h1 {
    color: #b45309;
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 0.5rem;
    text-shadow: 0 1px 5px rgba(0,0,0,0.55);
  }
  .overlay-panel p {
    color: #f59e0b;
    font-size: 0.9rem;
    margin: 0 0 1.25rem;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  .row { display: flex; gap: 0.6rem; }
  .row > a { flex: 1; }
  a.primary {
    display: block;
    font-size: 0.95rem; font-weight: 700; padding: 0.8rem 1rem; border-radius: 8px;
    background: var(--blue); color: #fff; border: 1.5px solid var(--blue);
    text-decoration: none; letter-spacing: 0.01em;
  }
  a.primary:hover { opacity: 0.92; }
  a.secondary {
    display: block;
    font-size: 0.95rem; font-weight: 700; padding: 0.8rem 1rem; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: #fff; border: 1.5px solid rgba(255,255,255,0.55);
    text-decoration: none; letter-spacing: 0.01em;
    backdrop-filter: blur(2px);
  }
  a.secondary:hover { background: rgba(255,255,255,0.16); border-color: #fff; }
</style>
</head>
<body>

<div class="landing-bg">
  <div class="overlay-panel">
    <div class="panel-inner">
      <h1>Trip Dispatch</h1>
      <p>This system is for authorized personnel only. If you were not sent a link directly, or you do not otherwise have access, please exit.</p>
      <div class="row">
        <a class="primary" href="home.html">Enter</a>
        <a class="secondary" href="https://www.google.com">Exit</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
